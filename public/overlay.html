<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>PokeOBS · Overlay</title>
    <link rel="stylesheet" href="/css/card.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
      #stage {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .dex-slot {
        position: absolute;
        transition:
          opacity 380ms ease,
          translate 380ms ease;
        opacity: 0;
        translate: 0 14px;
      }
      .dex-slot.measuring {
        visibility: hidden;
        transition: none;
      }
      .dex-slot.visible {
        opacity: 1;
        translate: 0 0;
      }
      .dex-slot.leaving {
        opacity: 0;
        translate: 0 -10px;
      }
      /* Combate doble: dos tarjetas apiladas como una baraja que se intercambian. */
      .dex-stack {
        --peek-x: 44px;
        --peek-y: 56px;
        --swap: 700ms;
        display: grid;
      }
      .dex-stack > .dex-card {
        grid-area: 1 / 1;
        align-self: start;
      }
      .dex-stack.double {
        padding: 0 var(--peek-x) var(--peek-y) 0;
      }
      .dex-stack.double > .dex-card {
        transform-origin: top right;
        transition:
          translate var(--swap) ease-in-out,
          scale var(--swap) ease-in-out,
          filter var(--swap) ease-in-out,
          z-index var(--swap) linear; /* entero: cambia de capa a mitad del movimiento */
      }
      .dex-stack.double > .dex-card.front {
        z-index: 2;
        translate: 0 var(--peek-y);
      }
      .dex-stack.double > .dex-card.back {
        z-index: 1;
        translate: var(--peek-x) 0;
        scale: 0.96;
        filter: brightness(0.62) saturate(0.8);
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-live="polite"></div>
    <script type="module" src="/js/overlay.js"></script>
  </body>
</html>
