<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>PokeOBS · Partida</title>
    <link rel="stylesheet" href="/css/card.css" />
    <link rel="stylesheet" href="/css/game.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
      #stage {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .view-root {
        position: absolute;
      }
      .view-part {
        transition:
          opacity 380ms ease,
          translate 380ms ease;
      }
      .view-part.entering {
        opacity: 0;
        translate: 0 14px;
      }
      .view-part.leaving {
        opacity: 0;
        translate: 0 -10px;
      }
      .view-badges .gm-badges {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="view-root" class="view-root"></div></div>
    <script type="module" src="/js/partida.js"></script>
  </body>
</html>
